[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vas2font"
version = "0.1.0"
description = "Convert vas handwriting into OpenType fonts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "fonttools==4.68.0",
    "python-multipart==0.0.34",
    "reportlab==5.1.0",
    "skia-pathops==0.9.2",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[project.scripts]
vas2font = "vas2font.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vas2font = ["assets/*.ttf", "assets/*OFL.txt", "node/*.mjs", "node/package*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
