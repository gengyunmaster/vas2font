[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vas2font"
version = "0.1.0"
description = "Convert vas handwriting into OpenType fonts"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.60,<5",
    "reportlab>=4.2,<5",
    "skia-pathops>=0.8,<1",
]

[project.scripts]
vas2font = "vas2font.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vas2font = ["assets/*.ttf", "assets/OFL.txt", "node/*.mjs", "node/package*.json"]
